<title>Choice Champs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Choice Champs">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one centered "toy box" column; every screen is a stage + chunky toy-block buttons a 4-year-old can hit. */
:root {
  --sky: #9ad8ff;
  --sky-pale: #dff3ff;
  --sky-deep: #2f8fe0;
  --sun: #ffd23f;
  --sun-deep: #e6a800;
  --grass: #6bcb6e;
  --grass-deep: #3a9a48;
  --coral: #ff7b5c;
  --coral-deep: #db5236;
  --ink: #22304d;
  --muted: #5b6987;
  --paper: #fffaf0;
  --white: #ffffff;
  --shadow: rgba(34, 48, 77, .22);
  --display: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--sky);
  color: var(--ink);
  font-family: var(--body);
  font-weight: 800;
  font-size: 18px;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
input, select { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }

#app {
  min-height: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
}
.screen { display: flex; flex-direction: column; gap: 14px; flex: 1; }

/* ---------- chunky toy buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 72px; padding: 10px 28px;
  border-radius: 26px;
  font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1;
  background: var(--white); color: var(--ink);
  box-shadow: 0 7px 0 var(--shadow);
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--shadow); }
.btn-play { background: var(--grass); color: var(--white); box-shadow: 0 7px 0 var(--grass-deep); font-size: 40px; min-height: 92px; }
.btn-play:active { box-shadow: 0 2px 0 var(--grass-deep); }
.btn-next { background: var(--sky-deep); color: var(--white); box-shadow: 0 7px 0 #1d65a8; }
.btn-next:active { box-shadow: 0 2px 0 #1d65a8; }
.btn-retry { background: var(--sun); box-shadow: 0 7px 0 var(--sun-deep); }
.btn-retry:active { box-shadow: 0 2px 0 var(--sun-deep); }
.btn-sticker b { background: var(--sun); border-radius: 999px; padding: 4px 12px; font-size: 22px; }
.icon-btn {
  width: 56px; height: 56px; flex: none; border-radius: 18px; background: var(--white);
  font-size: 26px; display: grid; place-items: center; box-shadow: 0 5px 0 var(--shadow);
}
.icon-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--shadow); }

/* ---------- top bar ---------- */
.topbar { display: flex; align-items: center; gap: 12px; }
.topbar h2 { flex: 1; min-width: 0; margin: 0; font-family: var(--display); font-size: 26px; line-height: 1.1; text-wrap: balance; }
.chip { flex: none; background: var(--white); border-radius: 999px; padding: 8px 14px; font-size: 20px; box-shadow: 0 4px 0 var(--shadow); font-variant-numeric: tabular-nums; }

/* ---------- home ---------- */
.home { align-items: center; text-align: center; position: relative; justify-content: center; gap: 18px; padding-top: 8px; }
.gear { position: absolute; top: 0; right: 0; width: 64px; height: 52px; border-radius: 16px; background: rgba(255,255,255,.55); font-size: 22px; }
.gear small { display: block; font-size: 9px; letter-spacing: .04em; margin-top: -2px; white-space: nowrap; }
.logo { font-family: var(--display); font-weight: 800; margin: 18px 0 0; font-size: clamp(52px, 15vw, 84px); line-height: .85; color: var(--white); text-shadow: 0 5px 0 var(--sky-deep); letter-spacing: -.01em; }
.logo span { color: var(--sun); text-shadow: 0 5px 0 var(--sun-deep); }
.buddy-big { font-size: clamp(96px, 30vw, 150px); line-height: 1.1; animation: bob 2.4s ease-in-out infinite; filter: drop-shadow(0 10px 0 rgba(34,48,77,.15)); }
.hello { margin: 0; font-size: 19px; color: var(--ink); max-width: 30ch; }
.home-actions { display: flex; flex-direction: column; gap: 18px; width: min(100%, 420px); }
.cloud { position: absolute; font-size: 54px; opacity: .9; pointer-events: none; animation: drift 14s ease-in-out infinite alternate; }
.cloud.c1 { top: 70px; left: -6px; }
.cloud.c2 { top: 210px; right: -4px; font-size: 40px; animation-delay: -6s; }

/* ---------- chapter map ---------- */
.path { display: flex; flex-direction: column; gap: 18px; position: relative; padding-block: 6px 12px; }
.path::before { content: ""; position: absolute; left: 50%; top: 30px; bottom: 30px; border-left: 6px dashed rgba(255,255,255,.8); transform: translateX(-50%); }
.island {
  position: relative; display: flex; align-items: center; gap: 14px; text-align: left;
  width: min(88%, 520px); padding: 16px 18px; border-radius: 30px;
  background: var(--white); box-shadow: 0 8px 0 var(--shadow);
}
.island:nth-child(odd) { align-self: flex-start; }
.island:nth-child(even) { align-self: flex-end; }
.island:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--shadow); }
.isl-icon { flex: none; width: 76px; height: 76px; border-radius: 24px; display: grid; place-items: center; font-size: 44px; background: var(--chip-bg); }
.isl-text { display: flex; flex-direction: column; min-width: 0; }
.isl-num { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.isl-title { font-family: var(--display); font-size: 26px; line-height: 1.05; }
.isl-stars { font-size: 17px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.isl-trophy { position: absolute; top: -14px; right: -8px; font-size: 38px; animation: bob 2s ease-in-out infinite; }
.island.locked { opacity: .7; filter: saturate(.3); }
.c-sun { --chip-bg: var(--sun); --band: var(--sun); --band-deep: var(--sun-deep); }
.c-coral { --chip-bg: var(--coral); --band: var(--coral); --band-deep: var(--coral-deep); }
.c-grass { --chip-bg: var(--grass); --band: var(--grass); --band-deep: var(--grass-deep); }
.c-sky { --chip-bg: var(--sky-deep); --band: var(--sky-deep); --band-deep: #1d65a8; }

/* ---------- chapter screen ---------- */
.ch-banner { background: var(--band); border-radius: 28px; padding: 18px 20px; display: flex; gap: 14px; align-items: center; box-shadow: 0 7px 0 var(--band-deep); }
.ch-banner .big { font-size: 56px; line-height: 1; }
.ch-banner p { margin: 0; font-size: 18px; }
.ch-banner h3 { margin: 0; font-family: var(--display); font-size: 30px; line-height: 1; }
.tiles { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 620px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tile {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 26px;
  background: var(--white); box-shadow: 0 7px 0 var(--shadow); text-align: left;
}
@media (min-width: 620px) { .tile { flex-direction: column; text-align: center; padding: 20px 12px; } }
.tile:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--shadow); }
.tile-pic { flex: none; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; font-size: 44px; background: var(--sky-pale); }
.tile.done .tile-pic { background: var(--sun); }
.tile-title { font-family: var(--display); font-size: 24px; line-height: 1.05; display: block; }
.stars3 { display: inline-flex; gap: 2px; font-size: 22px; margin-top: 4px; }
.stars3 .off { filter: grayscale(1); opacity: .3; }

/* ---------- scene stage ---------- */
.stage {
  position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; max-height: 44vh;
  border-radius: 30px; overflow: hidden; border: 5px solid var(--white);
  box-shadow: 0 8px 0 var(--shadow); box-sizing: border-box;
  --wall: var(--sky); --floor: var(--grass); --floor-at: 34%;
  background: linear-gradient(to top, var(--floor) var(--floor-at), var(--wall) var(--floor-at));
}
.stage.small { aspect-ratio: 16 / 7; }
.stage::before, .stage::after { content: ""; position: absolute; }
.actors {
  position: absolute; left: 0; right: 0; bottom: calc(var(--floor-at) - 9%);
  display: flex; justify-content: center; align-items: flex-end; gap: 4%;
}
.actor { font-size: clamp(54px, 15vw, 110px); line-height: 1; animation: pop .45s cubic-bezier(.3,1.6,.5,1) both, bob 2.6s ease-in-out infinite; animation-delay: calc(var(--i) * .12s), calc(var(--i) * .4s + .5s); }
.stage.small .actor { font-size: clamp(46px, 12vw, 84px); }

.bg-park { --wall: var(--sky); --floor: var(--grass); }
.bg-park::before { width: 18%; aspect-ratio: 1; border-radius: 50%; background: var(--sun); top: 9%; right: 8%; box-shadow: 0 0 0 10px rgba(255,210,63,.35); }
.bg-park::after { width: 30%; height: 10%; border-radius: 999px; background: var(--white); top: 14%; left: 8%; opacity: .9; }
.bg-home { --wall: #ffe2b6; --floor: #c98f5c; }
.bg-home::before { width: 26%; height: 30%; top: 10%; left: 9%; border-radius: 10px; background: linear-gradient(90deg, transparent 47%, var(--white) 47% 53%, transparent 53%), linear-gradient(transparent 47%, var(--white) 47% 53%, transparent 53%), var(--sky); border: 6px solid var(--white); }
.bg-kitchen { --wall: #fff1c6; --floor: #e5a96a; background: linear-gradient(to top, var(--floor) var(--floor-at), transparent var(--floor-at)), repeating-linear-gradient(90deg, #fff1c6 0 28px, #ffe7a3 28px 56px); }
.bg-kitchen::before { width: 22%; aspect-ratio: 1; top: 10%; right: 10%; border-radius: 50%; border: 6px solid var(--ink); background: var(--white); }
.bg-bath { --floor: #bfe6f2; background: linear-gradient(to top, var(--floor) var(--floor-at), transparent var(--floor-at)), repeating-linear-gradient(0deg, #e7f6ff 0 30px, #cfeaff 30px 32px), #e7f6ff; }
.bg-bath::before { width: 20%; height: 26%; top: 10%; left: 40%; border-radius: 40% 40% 12px 12px; background: var(--sky-pale); border: 6px solid var(--white); }
.bg-bedroom { --wall: #34488c; --floor: #c89a6c; }
.bg-bedroom::before { width: 14%; aspect-ratio: 1; top: 10%; right: 12%; border-radius: 50%; box-shadow: -14px 6px 0 0 #fff3b0; }
.bg-bedroom::after { width: 4px; height: 4px; top: 20%; left: 20%; border-radius: 50%; background: #fff3b0; box-shadow: 60px -10px #fff3b0, 120px 20px #fff3b0, 30px 40px #fff3b0, 170px -4px #fff3b0; }
.bg-store { --floor: #dfe3ea; background: linear-gradient(to top, var(--floor) var(--floor-at), transparent var(--floor-at)), repeating-linear-gradient(0deg, #ffffff 0 40px, #ff9f87 40px 48px), #fff; }
.bg-play { --wall: #ffd9e2; --floor: #9fd8c6; }
.bg-play::before { width: 60%; height: 10%; left: 20%; bottom: 12%; border-radius: 50%; background: #7fc8b2; }
.bg-calm { background: radial-gradient(circle at 50% 40%, #e9fbf7, #b3ece0 55%, var(--sky) 100%); }

/* ---------- caption bubble ---------- */
.caption {
  display: flex; align-items: center; gap: 12px; background: var(--white); border-radius: 26px;
  padding: 14px 14px 14px 20px; box-shadow: 0 6px 0 var(--shadow);
}
.caption p { flex: 1; min-width: 0; margin: 0; font-size: clamp(19px, 4.6vw, 24px); line-height: 1.3; text-wrap: pretty; }
.caption .icon-btn { background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); }
.actions { display: flex; justify-content: center; gap: 14px; margin-top: auto; padding-top: 6px; }
.actions .btn { flex: 1; max-width: 420px; }

/* ---------- choices ---------- */
.choices { display: flex; flex-direction: column; gap: 14px; }
.choice {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  min-height: 84px; padding: 10px 16px 10px 10px; border-radius: 26px;
  background: var(--paper); border: 4px solid var(--white); box-shadow: 0 7px 0 var(--shadow);
  transition: transform .15s, border-color .15s, background .15s;
  animation: pop .4s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(var(--i) * .1s);
}
.choice:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--shadow); }
.choice.reading { border-color: var(--sun); background: #fff4c4; transform: scale(1.025); }
.ch-icon { flex: none; width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; font-size: 38px; background: var(--white); }
.ch-label { flex: 1; min-width: 0; font-size: clamp(18px, 4.4vw, 22px); line-height: 1.2; }

/* ---------- result ---------- */
.result-banner { text-align: center; font-family: var(--display); font-size: clamp(34px, 9vw, 48px); line-height: 1; margin: 2px 0 0; color: var(--white); text-shadow: 0 4px 0 var(--grass-deep); }
.result-banner.oops { text-shadow: 0 4px 0 var(--coral-deep); }
.big-stars { display: flex; justify-content: center; gap: 10px; font-size: clamp(48px, 13vw, 68px); line-height: 1; }
.big-stars span { animation: starpop .6s cubic-bezier(.3,1.8,.5,1) both; }
.big-stars span:nth-child(2) { animation-delay: .25s; }
.big-stars span:nth-child(3) { animation-delay: .5s; }
.big-stars .off { filter: grayscale(1); opacity: .3; }
.got-sticker { align-self: center; display: flex; align-items: center; gap: 10px; background: var(--sun); border-radius: 999px; padding: 6px 18px 6px 8px; box-shadow: 0 5px 0 var(--sun-deep); font-size: 19px; }
.got-sticker span { font-size: 38px; }

/* ---------- breathing ---------- */
.breathe-stage { display: grid; place-items: center; }
.balloon { font-size: clamp(70px, 18vw, 110px); transition: transform 2.4s ease-out; transform: scale(.7); transform-origin: 50% 85%; }
.balloon.in { transition: transform 3s ease-out; transform: scale(1.9); }
.side-buddy { position: absolute; left: 6%; bottom: 6%; font-size: clamp(46px, 12vw, 72px); }
.breaths { display: flex; justify-content: center; gap: 14px; }
.breaths span { width: 30px; height: 30px; border-radius: 50%; background: var(--white); opacity: .6; box-shadow: inset 0 0 0 4px var(--sky-deep); }
.breaths span.on { background: var(--sky-deep); opacity: 1; animation: starpop .5s both; }
.btn-hold { background: #4cc9b0; color: var(--white); box-shadow: 0 7px 0 #2a9a84; min-height: 96px; font-size: 26px; white-space: nowrap; touch-action: none; -webkit-user-select: none; user-select: none; }
.btn-hold.holding { transform: translateY(5px) scale(.98); box-shadow: 0 2px 0 #2a9a84; }
.btn-hold:disabled { opacity: .55; }

/* ---------- celebration ---------- */
.celebrate { align-items: center; text-align: center; justify-content: center; gap: 18px; }
.celebrate .actions { flex-direction: column; align-items: center; width: 100%; }
.celebrate .actions .btn { width: 100%; }
.cel-title { margin: 0; font-family: var(--display); font-size: clamp(40px, 11vw, 60px); line-height: 1; color: var(--white); text-shadow: 0 5px 0 var(--band-deep, var(--sky-deep)); text-wrap: balance; }
.chest { font-size: clamp(130px, 40vw, 200px); line-height: 1; animation: wiggle 1.2s ease-in-out infinite; }
.trophy { font-size: clamp(120px, 34vw, 180px); line-height: 1; animation: spinin .9s cubic-bezier(.3,1.5,.5,1) both; }
.reward-card { display: flex; align-items: center; gap: 14px; text-align: left; width: min(100%, 460px); background: var(--white); border-radius: 26px; padding: 14px 18px; box-shadow: 0 6px 0 var(--shadow); box-sizing: border-box; animation: pop .5s .5s both; }
.reward-card .em { font-size: 52px; flex: none; }
.reward-card p { margin: 0; font-size: 19px; line-height: 1.25; min-width: 0; }
.reward-card small { display: block; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.reward-card.prize { background: var(--sun); box-shadow: 0 6px 0 var(--sun-deep); }

/* ---------- sticker book ---------- */
.book { background: var(--paper); border-radius: 30px; padding: 16px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 8px 0 var(--shadow); }
.book h3 { margin: 0 0 8px; font-family: var(--display); font-size: 22px; line-height: 1; }
.slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.slot { aspect-ratio: 1; border-radius: 22px; display: grid; place-items: center; font-size: clamp(34px, 10vw, 52px); background: var(--white); border: 3px dashed #cdd6e6; }
.slot.has { border: 3px solid var(--sun); background: #fff6d1; animation: pop .4s both; }
.slot.trophy-slot.has { background: var(--sun); }
.slot.empty { color: #cdd6e6; font-family: var(--display); font-size: 30px; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(34,48,77,.55); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--paper); border-radius: 30px; padding: 22px; width: min(100%, 480px); box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; text-align: center; max-height: 100%; overflow: auto; }
.sheet h3 { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1.05; }
.sheet p { margin: 0; font-size: 17px; color: var(--muted); }
.buddy-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.buddy-opt { aspect-ratio: 1; border-radius: 22px; background: var(--white); font-size: clamp(36px, 10vw, 50px); box-shadow: 0 5px 0 var(--shadow); display: grid; place-items: center; position: relative; }
.buddy-opt.sel { background: var(--sun); box-shadow: 0 5px 0 var(--sun-deep); }
.buddy-opt.locked { filter: grayscale(1) brightness(.4); opacity: .5; }
.buddy-opt small { position: absolute; bottom: 4px; right: 6px; font-size: 18px; filter: none; }
.hold-ring { --p: 0; width: 150px; height: 150px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; background: conic-gradient(var(--grass) calc(var(--p) * 1turn), #dfe5ef 0); touch-action: none; }
.hold-ring span { width: 118px; height: 118px; border-radius: 50%; background: var(--white); display: grid; place-items: center; font-size: 17px; color: var(--ink); line-height: 1.15; }
.text-btn { font-size: 17px; color: var(--muted); text-decoration: underline; padding: 8px; }

/* ---------- parent corner ---------- */
.parent { background: var(--paper); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 20px; font-weight: 700; font-size: 16px; }
.parent h3 { margin: 0; font-family: var(--display); font-size: 22px; line-height: 1.1; }
.parent p { margin: 0; line-height: 1.45; color: var(--muted); max-width: 62ch; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 800; color: var(--ink); }
.field input, .field select { font: inherit; font-weight: 700; font-size: 17px; padding: 12px 14px; border-radius: 14px; border: 2px solid #cdd6e6; background: var(--white); color: var(--ink); min-width: 0; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 460px) { .row2 { grid-template-columns: 1fr; } }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid #e6eaf2; color: var(--ink); font-weight: 800; }
.toggle input { width: 26px; height: 26px; accent-color: var(--grass-deep); flex: none; }
.tips details { border-top: 1px solid #e6eaf2; padding: 10px 0; }
.tips summary { cursor: pointer; font-weight: 800; color: var(--ink); }
.tips ul { margin: 10px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; color: var(--muted); line-height: 1.45; }
.tips li b { color: var(--ink); }
.pbtns { display: flex; flex-wrap: wrap; gap: 10px; }
.pbtn { padding: 12px 18px; border-radius: 14px; background: var(--white); border: 2px solid #cdd6e6; font-weight: 800; font-size: 16px; }
.pbtn.danger { border-color: var(--coral); color: var(--coral-deep); }
.pbtn.danger.armed { background: var(--coral); color: var(--white); }

/* ---------- confetti ---------- */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 60; }
.confetti i { position: absolute; top: -24px; width: 12px; height: 18px; border-radius: 4px; animation: fall var(--t) cubic-bezier(.3,.2,.6,1) var(--d) forwards; }

@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes starpop { 0% { transform: scale(0) rotate(-40deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-8deg) scale(1.05); } 40% { transform: rotate(8deg) scale(1.05); } 60% { transform: rotate(-4deg); } }
@keyframes spinin { from { transform: scale(0) rotate(-200deg); } to { transform: scale(1) rotate(0); } }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(30px); } }
@keyframes fall { to { transform: translate(var(--x), 110vh) rotate(var(--r)); } }

   SAVE DATA (lives only on this device)
   ===================================================================== */
const KEY = 'choice-champs-v1';
const DEFAULTS = { name: '', grownup: 'Mom', buddy: '🐻', voice: true, voiceName: '', rate: 1, sound: true, unlockAll: false, stars: {}, celebrated: [], prizes: {} };
function load() {

  catch (e) { return Object.assign({}, DEFAULTS); }
}

let S = load();

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const chapterDone = c => c.scenarios.every(s => S.stars[s.id] > 0);
const chapterOpen = i => S.unlockAll || i === 0 || chapterDone(CHAPTERS[i - 1]);
const chapterStars = c => c.scenarios.reduce((n, s) => n + (S.stars[s.id] || 0), 0);
const totalStars = () => CHAPTERS.reduce((n, c) => n + chapterStars(c), 0);
const buddyOpen = b => !b.unlock || chapterDone(chapter(b.unlock));
const stickerCount = () => CHAPTERS.reduce((n, c) => n + c.scenarios.filter(s => S.stars[s.id] > 0).length + (chapterDone(c) ? 1 : 0), 0);
const stars3 = n => `<span class="stars3" aria-label="${n} of 3 stars">${[1, 2, 3].map(i => `<span class="${i <= n ? '' : 'off'}">⭐</span>`).join('')}</span>`;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* =====================================================================
   VOICE (read-aloud, since most 4-year-olds can't read yet)
   ===================================================================== */
const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
let voice = null, voiceList = [], seq = 0, lastNarration = null;
// Novelty voices on Apple devices that sound like robots or effects.
const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Jester|Junior|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Ralph|Fred|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
function voiceScore(v) {
  const n = v.name;
  let s = 0;
  if (/Premium/i.test(n)) s += 100;
  if (/Enhanced/i.test(n)) s += 80;
  if (/Natural|Neural|Online/i.test(n)) s += 70;   // Edge/Windows neural voices
  if (/Siri/i.test(n)) s += 60;
  if (/^Google/i.test(n)) s += 40;                  // Chrome/Android cloud voices
  if (/Ava|Zoe|Allison|Evan|Nathan|Noelle|Susan|Joelle|Aria|Jenny|Samantha/i.test(n)) s += 15;
  if (v.lang === 'en-US') s += 10; else if (/^en-(GB|AU|CA|IE)/i.test(v.lang)) s += 5;
  return s;
}
// Recorded natural voice: audio/manifest.js lists every pre-recorded line as
// window.CC_CLIPS = { <hash of the spoken text>: 1, ... }. Lines that are not
// recorded (or a missing manifest) fall back to the device's speech voice.
const CLIPS = window.CC_CLIPS || {};
const hasClips = Object.keys(CLIPS).length > 0;
const useNatural = () => hasClips && (!S.voiceName || S.voiceName === 'natural');
function clipHash(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(16).padStart(8, '0'); }
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function clipFor(text) {
  const key = speakable(text);
  if (CLIPS[clipHash(key)]) return 'audio/' + clipHash(key) + '.mp3';
  // A line with the child's name in it: use the recording without the name.
  if (S.name) {
    const plain = key.replace(new RegExp('[, ]+' + reEsc(S.name) + '(?=\\W|$)', 'g'), '');
    if (CLIPS[clipHash(plain)]) return 'audio/' + clipHash(plain) + '.mp3';
  }
  return null;
}
const player = typeof Audio !== 'undefined' ? new Audio() : null;
if (player) { player.preload = 'auto'; player.preservesPitch = true; player.webkitPreservesPitch = true; }
const RATES = [[0.8, 'Slow'], [1, 'Normal'], [1.2, 'Faster']];
const rate = () => RATES.some(r => r[0] === S.rate) ? S.rate : 1;

function pickVoice() {
  if (!synth) return;
  voiceList = synth.getVoices().filter(v => /^en/i.test(v.lang) && !NOVELTY.test(v.name))
    .sort((a, b) => voiceScore(b) - voiceScore(a));
  voice = (S.voiceName && voiceList.find(v => v.name === S.voiceName)) || voiceList[0] || null;
  const sel = document.getElementById('p-voicename');
  if (sel) fillVoiceSelect(sel);
}
function fillVoiceSelect(sel) {
  const nat = useNatural();
  sel.innerHTML = (hasClips ? `<option value="natural" ${nat ? 'selected' : ''}>Natural voice ★ (recommended)</option>` : '')
    + (voiceList.length
      ? voiceList.map(v => `<option value="${esc(v.name)}" ${!nat && voice && v.name === voice.name ? 'selected' : ''}>Device: ${esc(v.name)}</option>`).join('')
      : hasClips ? '' : '<option value="">Default voice</option>');
}
if (synth) { pickVoice(); try { synth.addEventListener('voiceschanged', pickVoice); } catch (e) {} }
const speakable = t => t.replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '').replace(/\s+/g, ' ').trim();
function sayDevice(text, fin) {
  if (!synth) return fin();
  try {
    const u = new SpeechSynthesisUtterance(speakable(text));
    u.rate = 0.92 * rate(); u.pitch = 1;
    if (voice) u.voice = voice;
    u.onend = fin; u.onerror = fin;
    synth.speak(u);
    setTimeout(fin, 1500 + text.length * 85 / rate());
  } catch (e) { fin(); }
}
function say(text) {
  return new Promise(res => {
    if (!S.voice) return res();
    let done = false;
    const fin = () => { if (!done) { done = true; player && (player.onended = player.onerror = null); res(); } };
    const src = useNatural() && player && clipFor(text);
    if (!src) return sayDevice(text, fin);
    try {
      player.onended = fin;
      player.onerror = () => { if (!done) { player.onended = player.onerror = null; sayDevice(text, fin); } };
      player.src = src;
      player.playbackRate = rate();
      const p = player.play();
      if (p && p.catch) p.catch(() => { if (!done) { player.onended = player.onerror = null; sayDevice(text, fin); } });
      setTimeout(fin, 3000 + text.length * 110 / rate());
    } catch (e) { sayDevice(text, fin); }
  });
}
function prefetch(lines) {
  if (!useNatural()) return;
  lines.forEach(t => { const s = clipFor(t); if (s) fetch(s).catch(() => {}); });
}
function hush() { seq++; try { synth && synth.cancel(); } catch (e) {} try { if (player) { player.onended = player.onerror = null; player.pause(); } } catch (e) {} }
async function narrate(lines, onEach) {
  hush();
  const my = seq;
  lastNarration = [lines, onEach];
  prefetch(lines.slice(1));
  for (let i = 0; i < lines.length; i++) {
    if (my !== seq) return;
    onEach && onEach(i);
    await say(lines[i]);
  }
  if (my === seq && onEach) onEach(-1);
}

/* =====================================================================
   SOUND EFFECTS (synthesized, no files)
   ===================================================================== */
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, at, dur, type = 'triangle', vol = 0.12) {
  const a = S.sound && audio(); if (!a) return;
  const t = a.currentTime + at, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
const SFX = {
  tap() { tone(700, 0, 0.07, 'sine', 0.06); },
  yay() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.3)); },
  oops() { tone(392, 0, 0.2, 'sine', 0.1); tone(311, 0.2, 0.35, 'sine', 0.1); },
  star(i) { tone(880 + i * 180, 0, 0.25, 'triangle', 0.09); },
  fanfare() { [[523, 0], [523, .15], [523, .3], [659, .45], [784, .75], [659, .95], [1047, 1.15]].forEach(([f, t]) => tone(f, t, 0.35, 'square', 0.05)); }
};

function confetti(n = 70) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#ffd23f', '#ff7b5c', '#6bcb6e', '#2f8fe0', '#ffffff', '#ff9fc4'];
  for (let i = 0; i < n; i++) {
    const p = document.createElement('i');
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[i % colors.length];
    p.style.setProperty('--x', (Math.random() * 160 - 80) + 'px');
    p.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
    p.style.setProperty('--t', (1.8 + Math.random() * 1.6) + 's');
    p.style.setProperty('--d', (Math.random() * .5) + 's');
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4200);
}

/* ---------- playing a scenario ---------- */
let run = null;
function startScenario(chId, scId) {
  const c = chapter(chId), sc = c.scenarios.find(s => s.id === scId);
  run = { c, sc, phase: 'step', step: 0, tries: 0, picked: null, earned: 0, newSticker: false, choices: shuffle(sc.choices.slice()) };
  renderPlay();
}
function stageHTML(bg, actors, cls = '') {
  return `<div class="stage bg-${bg} ${cls}"><div class="actors">${actors.map((a, i) => `<span class="actor" style="--i:${i}">${actor(a)}</span>`).join('')}</div></div>`;
}
function captionHTML(text) {
  return `<div class="caption"><p>${esc(text)}</p><button class="icon-btn" data-act="replay" aria-label="Hear it again">🔊</button></div>`;
}
function paint(inner) {
  app.innerHTML = `<div class="screen play c-${run.c.color}">${topbar('chapter', run.sc.title, run.c.id)}${inner}</div>`;
}
const lastSceneBg = () => { const s = run.sc.steps.filter(x => x.bg); return s.length ? s[s.length - 1].bg : 'park'; };

function renderPlay() {
  const { sc } = run;
  if (run.phase === 'step') {
    const st = sc.steps[run.step];
    if (st.type === 'breathe') return renderBreathe(st);
    paint(`${stageHTML(st.bg, st.actors)}${captionHTML(fill(st.text))}
      <div class="actions"><button class="btn btn-next" data-act="next">Next ➜</button></div>`);
    narrate([fill(st.text)]);
  } else if (run.phase === 'choose') {
    paint(`${stageHTML(lastSceneBg(), ['BUDDY', '🤔'], 'small')}${captionHTML(fill(sc.ask))}
      <div class="choices">${run.choices.map((ch, i) => `<button class="choice" style="--i:${i}" data-act="pick" data-arg="${i}">
        <span class="ch-icon">${ch.icon}</span><span class="ch-label">${esc(fill(ch.label))}</span></button>`).join('')}</div>`);
    const cards = () => app.querySelectorAll('.choice');
    narrate([fill(sc.ask), ...run.choices.map(ch => fill(ch.label))], i => {
      cards().forEach((el, k) => el.classList.toggle('reading', k === i - 1));
    });
  } else {
    const p = run.picked;
    if (p.ok) {
      paint(`<p class="result-banner">Champion choice!</p>
        ${stageHTML(p.bg, p.actors, 'small')}
        ${captionHTML(fill(p.text))}
        <div class="big-stars" aria-label="${run.earned} stars">${[1, 2, 3].map(i => `<span class="${i <= run.earned ? '' : 'off'}">⭐</span>`).join('')}</div>
        ${run.newSticker ? `<div class="got-sticker"><span>${run.sc.sticker}</span> New sticker!</div>` : ''}
        <div class="actions"><button class="btn btn-next" data-act="after">Next ➜</button></div>`);
      SFX.yay(); confetti();
      for (let i = 0; i < run.earned; i++) setTimeout(() => SFX.star(i), 400 + i * 250);
      const cheer = [`Great job${S.name ? ', ' + S.name : ''}! You are a Choice Champ!`].concat(run.newSticker ? ['You got a new sticker!'] : []);
      narrate([fill(p.text), ...cheer]);
    } else {
      paint(`<p class="result-banner oops">Uh oh!</p>
        ${stageHTML(p.bg, p.actors, 'small')}
        ${captionHTML(fill(p.text))}
        <div class="actions"><button class="btn btn-retry" data-act="retry">🔁 Try again</button></div>`);
      SFX.oops();
      narrate([fill(p.text), 'Let\'s try a different choice!']);
    }
  }
}

function pick(i) {
  const ch = run.choices[i];
  run.tries++;
  run.picked = ch;
  if (ch.ok) {
    const prev = S.stars[run.sc.id] || 0;
    run.earned = Math.max(1, 4 - run.tries);
    run.newSticker = prev === 0;
    S.stars[run.sc.id] = Math.max(prev, run.earned);
    save();
  }
  run.phase = 'result';
  renderPlay();
}

function afterScenario() {
  const { c, sc } = run;
  if (chapterDone(c) && !S.celebrated.includes(c.id)) return renderCelebrate(c);
  const next = c.scenarios[c.scenarios.indexOf(sc) + 1];
  if (next) startScenario(c.id, next.id); else renderChapter(c.id);
}

/* ---------- belly-breathing balloon ---------- */
function renderBreathe(st) {
  paint(`<div class="stage bg-calm breathe-stage"><div class="balloon" id="balloon">🎈</div><span class="side-buddy">${S.buddy}</span></div>
    ${captionHTML(fill(st.text))}
    <div class="breaths" id="breaths" aria-label="Breaths">${'<span></span>'.repeat(3)}</div>
    <div class="actions" id="breatheActions"><button class="btn btn-hold" id="holdBtn">Hold to breathe in</button></div>`);
  narrate([fill(st.text), 'Press and hold the button, and breathe in slowly.']);

  const btn = document.getElementById('holdBtn'), balloon = document.getElementById('balloon');
  let count = 0, holding = false, t0 = 0, resting = false;
  const down = e => {
    e.preventDefault();
    if (resting || holding || count >= 3) return;
    holding = true; t0 = performance.now();
    try { btn.setPointerCapture(e.pointerId); } catch (_) {}
    btn.classList.add('holding'); btn.textContent = 'Breathe in… 🌬️';
    balloon.classList.add('in');
    narrate(['Breathe in, slowly.']);
  };
  const up = () => {
    if (!holding) return;
    holding = false;
    btn.classList.remove('holding');
    balloon.classList.remove('in');
    if (performance.now() - t0 < 1200) {
      btn.textContent = 'Hold to breathe in';
      narrate(['Hold a little longer. Nice and slow.']);
      return;
    }
    count++;
    document.querySelectorAll('#breaths span')[count - 1].classList.add('on');
    SFX.star(count);
    resting = true;
    btn.disabled = true;
    btn.textContent = 'Blow it out… 😮‍💨';
    narrate(['And blow it all out.']);
    setTimeout(() => {
      resting = false;
      if (count < 3) { btn.disabled = false; btn.textContent = 'Again! Hold me'; return; }
      document.querySelector('.caption p').textContent = 'You feel calmer. Great breathing!';
      document.getElementById('breatheActions').innerHTML = '<button class="btn btn-next" data-act="next">Next ➜</button>';
      narrate(['You feel calmer. Great breathing!']);
    }, 2400);
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

  next: () => { run.step++; if (run.step >= run.sc.steps.length) run.phase = 'choose'; renderPlay(); },
  pick: i => pick(+i),
  retry: () => { run.phase = 'choose'; run.choices = shuffle(run.sc.choices.slice()); renderPlay(); },
  after: afterScenario,
  replay: () => { if (lastNarration) narrate(...lastNarration); },
  open: openPrize,
  stickers: renderStickers,
  buddies: renderBuddies,
  usebuddy: e => { S.buddy = e; save(); closeOverlay(); renderHome(); },
  lockedbuddy: (e, el) => { const b = BUDDIES.find(x => x.e === e); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); narrate([`Finish ${chapter(b.unlock).title} to unlock ${b.name}!`]); },
  gate: renderGate,
  close: closeOverlay,
  testvoice: () => { const was = S.voice; S.voice = true; narrate([`Hi${S.name ? ', ' + S.name : ''}! Let's make champion choices!`]); S.voice = was; },
  reset: (_, el) => {
    if (!resetArmed) { resetArmed = true; el.classList.add('armed'); el.textContent = 'Tap again to erase everything'; setTimeout(() => { resetArmed = false; if (el.isConnected) { el.classList.remove('armed'); el.textContent = 'Reset all progress'; } }, 4000); return; }
    resetArmed = false;
    S.stars = {}; S.celebrated = []; save();
    renderParent();
  }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  audio();
  if (b.dataset.act !== 'pick') SFX.tap();
  const fn = ACTIONS[b.dataset.act];
  if (fn) fn(b.dataset.arg, b);
});

renderHome();
</script>
